name: Pi Scripts CI

on:
  push:
    branches: [main, develop]
    paths:
      - "pi/**"
      - "tests/pi/**"
      - ".github/workflows/pi_scripts.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "pi/**"
      - "tests/pi/**"
      - ".github/workflows/pi_scripts.yml"

jobs:
  lint-and-test:
    name: Lint and Test Pi Scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install opencv-python-headless ultralytics flask numpy

      - name: Check formatting (Black)
        run: black --check pi tests/pi

      - name: Lint (Flake8)
        run: flake8 pi tests/pi

      - name: Run Pi scripts tests
        run: pytest tests/pi -v
